# 复制为当前工作目录下的 config.ini，然后直接运行程序，无需启动参数。
# 支持 key=value，可选 [huashan] 节；注释请单独占一行。
# 省略字段时使用默认值，不展开 ~ 或 $HOME。
[huashan]
listen = 127.0.0.1:8080
# 管理员账号和密码，仅在首次启动、数据库无用户时用于初始化。
# 密码须为 12–128 字节，请在首次运行前填写；初始化后可清空。
username = admin
password = 123456123456
secure_cookie = false
# 兼容旧配置保留；来源拦截已关闭，此项不再限制请求
allowed_origin = http://localhost:5173, http://127.0.0.1:5173

# root 必须是源码目录外、不含符号链接的绝对路径。
# 默认 HUASHAN_ROOT，或系统用户配置目录下的 Huashan。
root = /Users/lyu/HuashanRuntime

# 默认 DOCKER_HOST > Docker Desktop Socket > /var/run/docker.sock。
# docker_endpoint = unix:///absolute/path/to/docker.sock

